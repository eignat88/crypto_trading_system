# Trend Pullback DCA v1 Configuration
# Гибкая стратегия для MVP с scoring system

strategy:
  name: TrendPullbackDCA
  version: v1

entry:
  # Trend filters
  ema_fast: 50
  ema_slow: 200

  # RSI range for pullback
  rsi_min: 35
  rsi_max: 55

  # Distance from EMA50 (3%)
  ema50_distance: 0.03

  # Minimum score to enter (out of 10)
  min_score: 7

  # Volatility filter (ATR as % of price)
  atr_min_pct: 0.005  # 0.5%
  atr_max_pct: 0.05   # 5%

  # Allowed market regimes
  allowed_regimes:
    - TREND_UP
    - TREND_RECOVERY

risk:
  # Position sizing
  initial_position: 0.05  # 5% of capital
  max_position: 0.10      # 10% of capital
  base_order_pct: 0.25    # 25% of max position

exit:
  take_profit: 0.05   # 5%
  stop_loss: 0.03     # 3%
  trailing_stop_activation: 0.03  # activate at 3% profit
  trailing_stop_distance: 0.02    # trail by 2%
  max_holding_periods: 100        # candles

# Backtest settings
backtest:
  initial_balance: 5000
  commission: 0.001  # 0.1%
  slippage: 0.0005   # 0.05%
