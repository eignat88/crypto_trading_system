name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Foundation baseline: block real Pyflakes correctness errors while the
      # accumulated unused-import/local cleanup remains explicit lint debt.
      - run: python -m ruff check . --select F --ignore F401,F841 --output-format=github

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit -q

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crypto_trading_test
          POSTGRES_USER: crypto_test
          POSTGRES_PASSWORD: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto_test -d crypto_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://crypto_test:crypto_test@localhost:5432/crypto_trading_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/integration/test_postgresql_pipeline.py -q
